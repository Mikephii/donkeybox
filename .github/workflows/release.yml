# A tag v<version> (matching package.json) builds the release: the image for linux/amd64 and
# linux/arm64 pushed to ghcr.io/<owner>/donkeybox as <version> and latest, with its release manifest
# as the org.donkeybox.release label, and a GitHub release carrying the tarball and the manifest.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # ghcr.io/<owner>/donkeybox, lowercased because GHCR refuses capitals; a fork publishes its own.
        env:
          OWNER: ${{ github.repository_owner }}
        run: IMAGE="ghcr.io/${OWNER,,}/donkeybox" scripts/release.sh --push "${GITHUB_REF_NAME#v}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/workbench-$V.tar.gz" "dist/workbench-$V.release.json" \
            --title "$V" --generate-notes
